name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: unit tests + shellcheck + setup-script storage test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r bench/requirements.txt

      - name: host-gate unit tests
        run: python -m unittest discover -s bench/tests -v

      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.10.0 -x \
            scripts/*.sh tests/*.sh docker/*.sh

      - name: ec2-setup.sh instance-store logic on loop devices (privileged container)
        run: tests/ec2-setup-storage.sh

      - name: ec2-setup.sh full dry run (must stop at the missing instance store)
        run: |
          out=$(docker run --rm -v "$PWD:/repo:ro" -w /repo ubuntu:24.04 \
                bash -c 'DRY_RUN=1 bash scripts/ec2-setup.sh' 2>&1 || true)
          echo "$out"
          grep -q "no NVMe instance-store device found" <<<"$out"

  correctness:
    name: build + dev-preset verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.81.0

      # setup-java rejects the build-qualified "21.0.4+7"; "21.0.4" resolves to the
      # only Temurin 21.0.4 GA build, which the next step asserts.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21.0.4"

      - name: assert JDK build 21.0.4+7
        run: java -version 2>&1 | tee /dev/stderr | grep -q '21.0.4+7'

      - uses: sbt/setup-sbt@v1
        with:
          sbt-runner-version: 1.10.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: deps-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'pipeline-scala/build.sbt', 'pipeline-scala/project/*') }}

      - run: pip install -r bench/requirements.txt

      - name: build (Rust system + mimalloc, Scala fat jar with tests)
        run: make build

      - name: unit tests + integration test (dev preset, verify)
        run: make test PRESET=dev

  harness:
    name: docker images + harness dry run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r bench/requirements.txt -r analysis/requirements.txt

      - name: build images
        run: make images

      - name: generate a tiny dataset
        run: |
          mkdir -p data/tiny
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/data:/data" --entrypoint datagen \
            rvj-rust:latest --rows 200000 --files 4 --out /data/tiny

      - name: preflight (report only)
        run: python bench/preflight.py --data data

      # GitHub runners are VMs (not allowlisted EC2), so timings are refused;
      # --dry-run checks the plumbing only, for both host classes.
      - name: harness dry run (cloud-vm)
        run: |
          python bench/run.py --data data/tiny --dry-run --host-class cloud-vm --runs 2 --warmups 1 \
            --nmt-runs 1 --results results/vm --seed 1

      - name: harness dry run (bare-metal)
        run: |
          python bench/run.py --data data/tiny --dry-run --host-class bare-metal --runs 2 --warmups 0 \
            --nmt-runs 0 --results results/metal --seed 2

      - name: analysis + compare-hosts (dry run)
        run: |
          python analysis/analyze.py results/vm/*Z-dryrun --allow-dry-run --bootstrap 50
          python analysis/analyze.py results/metal/*Z-dryrun --allow-dry-run --bootstrap 50
          python analysis/compare_hosts.py --vm results/vm/*Z-dryrun --metal results/metal/*Z-dryrun \
            --allow-dry-run --bootstrap 50 --out results/compare

      - name: heap sweep dry run (full H_min search, reduced sweep)
        run: |
          python bench/heapsweep.py --data data/tiny --dry-run --runs 1 --warmups 0 \
            --multiples 1.25,2 --results results --seed 1

      - name: heap-sweep validation dry run (same tiny dataset)
        run: |
          python bench/heapsweep.py --data data/tiny --dry-run --attempts 1 \
            --validate-from results/*-heapsweep-dryrun --results results

      - name: heap-sweep analysis (dry run)
        run: |
          python analysis/heapsweep.py results/*Z-heapsweep-dryrun --allow-dry-run \
            --validation results/*-heapsweep-validate-dryrun

      - name: calibration dry run
        run: python bench/calibrate.py --data data/tiny --dry-run --host-class cloud-vm --results results

      - name: export-results
        run: scripts/export-results.sh results/vm/*Z-dryrun

      - uses: actions/upload-artifact@v4
        with:
          name: harness-dry-run
          path: |
            results/**/*-dryrun/
            results/compare/
            results/exports/
          retention-days: 7
