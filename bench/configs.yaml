# Benchmark matrix. Every value here is copied into manifest.json for each run.

images:
  rust: rvj-rust:latest     # built by `make images` (docker/rust.Dockerfile)
  scala: rvj-scala:latest   # built by `make images` (docker/scala.Dockerfile)

# Resource envelope R = {vCPUs = 4, Memory Max = 4 GB}; swap disabled.
container:
  cpus: "4"
  memory: 4g
  memory_swap: 4g
  cores: 4                  # physical cores picked by docker/pick-cores.sh unless --cpuset is given

pipeline:
  workers: 4
  batch_size: 8192

# "Production-style" JVM configuration (bench/run.py): fixed, pre-touched 3 GiB heap,
# as a capacity-planned service would run. JVM memory here reflects the setting, not
# the need; the heap sweep below measures the need.
jvm_common: ["-Xms3G", "-Xmx3G", "-XX:+AlwaysPreTouch"]

configs:
  rust-system:
    image: rust
    command: ["pipeline-rust"]
  rust-mimalloc:
    image: rust
    command: ["pipeline-rust-mimalloc"]
  scala-g1:
    image: scala
    jvm_flags: ["-XX:+UseG1GC"]
  scala-zgc:
    image: scala
    jvm_flags: ["-XX:+UseZGC", "-XX:+ZGenerational"]
  scala-parallel:
    image: scala
    jvm_flags: ["-XX:+UseParallelGC"]

protocol:
  # Measured runs per config (and per heap-sweep point) come from hosts.<class>.runs
  # unless --runs is given; executed in randomized order.
  jvm_warmup_runs: 2        # per JVM config, on the warm-up dataset; discarded
  nmt_runs: 1               # per JVM config, NativeMemoryTracking=summary; excluded from timing
  sample_hz: 10             # host-side cgroup sampling frequency
  drop_caches: true         # sync + `sysctl vm.drop_caches=3` before every run (root or sudoers rule)
  # A run is flagged when CPU steal on its cores exceeds this fraction of its CPU time.
  steal_flag_fraction: 0.005

# Host classes (--host-class). Timed runs on a VM are allowed only as cloud-vm, and
# only when every cloud-vm gate passes (bench/hostinfo.py: evaluate_gates).
hosts:
  bare_metal:
    runs: 10
  cloud_vm:
    runs: 20                # more runs to average out VM noise
    instance_allowlist: [c6id.4xlarge, c6id.metal]
    instance_store_model: "Amazon EC2 NVMe Instance Storage"

# Heap-size sweep (bench/heapsweep.py), after Hertz & Berger (OOPSLA 2005).
# Phase 1 binary-searches H_min per collector; phase 2 runs each collector at
# multiples of its own H_min. -Xms = -Xmx, and NO -XX:+AlwaysPreTouch, so that
# resident memory reflects what the JVM actually touches.
heapsweep:
  collectors: [scala-g1, scala-zgc, scala-parallel]   # GC flags taken from `configs`
  references: [rust-system, rust-mimalloc]            # flat reference lines
  search:
    low_mib: 128             # lower bound tried first (passes => H_min = low_mib)
    high_mib: 3072           # must pass; the production-style heap
    granularity_mib: 128
    attempts: 3              # a probe passes only if all attempts succeed (same JVM flags as the sweep, JFR on)
    timeout_factor: 10       # probe timeout = factor x wall time of the high_mib probe ...
    timeout_min_s: 120       # ... but never less than this
  multiples: [1.25, 1.5, 2, 3, 4]
  # heap + off-heap must fit the cgroup. The off-heap reserve is MEASURED per
  # collector: one NMT run at search.high_mib on the sweep dataset;
  # reserve = factor x non-heap committed, rounded up to round_mib, at least
  # floor_mib; heap cap = cgroup_mib - reserve. Points above the cap are skipped.
  cgroup_mib: 4096
  reserve:
    factor: 1.5
    round_mib: 64
    floor_mib: 512
  runs: null                 # per (collector, multiple) and per reference; null = hosts.<class>.runs
  warmup_runs: 1             # per (collector, multiple); discarded
